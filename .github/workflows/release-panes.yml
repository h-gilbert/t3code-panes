name: Release (panes)

# Started by `vp run release:panes` after it attaches the signed macOS app to a
# draft release. Builds the Linux server that self-updating servers download,
# then publishes the release so updaters only ever see complete releases.
# See docs/operations/fork-releases.md.
run-name: Release panes ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork release version, e.g. 0.0.44-panes.1790900000000"
        required: true
      ref:
        description: "Commit the release is built from"
        required: true

permissions:
  contents: write

concurrency:
  group: release-panes-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  linux_server:
    name: Linux x64 server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      # Public identifiers, the same values the macOS build reads from .env.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-panes\.[0-9]{13}$ ]] || { echo "Not a fork release version: $VERSION" >&2; exit 1; }
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq 'if .isDraft and any(.assets[]; .name == "latest-mac.yml") then "ok" else error("draft with latest-mac.yml not found") end'

      # Same checkout as release-desktop.yml: the vendored .repos tree is not needed.
      - name: Checkout
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Build resource monitor
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      - name: Build CLI single-executable
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Attach to the draft and publish
        run: |
          set -euo pipefail
          (cd release-cli && sha256sum t3-*.tar.gz > SHA256SUMS)
          gh release upload "v$VERSION" release-cli/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
